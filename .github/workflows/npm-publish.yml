name: Publish NPM Package to GitHub Packages and npm

on:
  workflow_call:
    inputs:
      node-version:
        default: "24"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build Plugin
        run: npm run build

      - name: Verify package integrity
        run: npm pack --dry-run

      - name: Authenticate with GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PUBLISH_GITHUB_TOKEN }}" > ~/.npmrc
          echo "registry=https://npm.pkg.github.com" >> ~/.npmrc

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --registry=https://npm.pkg.github.com

      - name: Detect npm publish mode
        id: npm-publish-mode
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm registry (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-publish-mode.outputs.mode == 'trusted'
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org

      - name: Publish to npm registry (first release bootstrap)
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-publish-mode.outputs.mode == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PUBLISH_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "PUBLISH_NPM_TOKEN is required for first publish before Trusted Publishing can be configured."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
          npm publish --access public --registry=https://registry.npmjs.org
